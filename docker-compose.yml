# Backing services for code-search. The CLI itself runs on the host (it reads
# your source tree directly); qdrant provides the vector store it talks to over
# HTTP.
#
#   docker compose up -d
#
# The default url in .env.example (127.0.0.1:6333) matches the published ports
# below, so no extra config is needed when running the CLI on the host.

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok >&3"]
      interval: 10s
      timeout: 5s
      retries: 5
